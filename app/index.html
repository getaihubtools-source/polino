<script id="engine">
const E=(function(){

const UNITS={toman:'تومان',rial:'ریال',newrial:'ریال جدید',usd:'دلار',eur:'یورو'};
const SCHEMA=2;
const r6=x=>Math.round(x*1e6)/1e6;
function toEn(s){return String(s==null?'':s).replace(/[۰-۹]/g,d=>FA.indexOf(d)).replace(/[٠-٩]/g,d=>AR.indexOf(d))}
function toFa(s){return String(s).replace(/[0-9]/g,d=>FA[+d])}
function normText(s){return toEn(s).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/ۀ/g,'ه').replace(/ـ/g,'')}
function stripZ(s){return s.replace(/[‌‍]/g,'')}
function cmpText(s){return stripZ(normText(s)).toLowerCase()}
/* ---------- اعداد ---------- */
function parseAmount(s){
  const t=normText(s).replace(/[٬،,\s]/g,'').replace(/٫/g,'.');
  if(t===''||!/^-?\d+(\.\d+)?$/.test(t))return NaN;

function fmtNum(n){

/* ---------- تاریخ: میلادی ISO در دیتابیس، شمسی در UI ---------- */
const div=(a,b)=>~~(a/b),mod=(a,b)=>a-~~(a/b)*b;

}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;return d}

const p2=n=>(n<10?'0':'')+n;
function isoValid(s){

function todayIso(d){d=d||new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}

function parseJDate(str){
  const p=normText(str).trim().split(/[\/\-.\s]+/).filter(Boolean).map(Number);

function fmtJ(iso){const j=isoToJ(iso);return toFa(j.jy+'/'+p2(j.jm)+'/'+p2(j.jd))}
function fmtJLong(iso){const j=isoToJ(iso);const w=new Date(Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))).getUTCDay();return WD[w]+' '+toFa(j.jd)+' '+JM[j.jm-1]+' '+toFa(j.jy)}
function monthRange(jy,jm){return{from:jToIso(jy,jm,1),to:jToIso(jy,jm,daysInJMonth(jy,jm))}}

function addMonths(jy,jm,n){const t=jy*12+(jm-1)+n;return{jy:Math.floor(t/12),jm:t-Math.floor(t/12)*12+1}}
/* ---------- محاسبات مالی ---------- */
function inRange(d,from,to){return(!from||d>=from)&&(!to||d<=to)}
function periodTotals(txs,from,to){
  let income=0,expense=0,count=0;
  for(const t of txs){
    if(t.type==='transfer'||!inRange(t.date,from,to))continue;
    count++;if(t.type==='income')income+=t.amount;else if(t.type==='expense')expense+=t.amount;

  const m=new Map();

function balances(accounts,txs){
  const b={};for(const a of accounts)b[a.id]=a.initialBalance||0;

    else if(t.type==='expense'&&t.accountId in b)b[t.accountId]-=t.amount;
    else if(t.type==='transfer'){if(t.sourceAccountId in b)b[t.sourceAccountId]-=t.amount;if(t.destinationAccountId in b)b[t.destinationAccountId]+=t.amount}

  const keys=[];for(let i=n-1;i>=0;i--){const x=addMonths(jy,jm,-i);keys.push(x)}

  const out=keys.map(k=>({jy:k.jy,jm:k.jm,label:JM[k.jm-1],income:0,expense:0,net:0}));

    if(t.type==='transfer')continue;
    const j=isoToJ(t.date),i=idx[j.jy*100+j.jm];if(i===undefined)continue;

  out.forEach(o=>{o.income=r6(o.income);o.expense=r6(o.expense);o.net=r6(o.income-o.expense)});

const UNIT_MUL={'میلیارد':1e9,'میلیون':1e6,'ملیون':1e6,'هزار':1e3,'k':1e3};
function parseQuick(text,categories,today){
  const out={amount:null,type:'expense',categoryId:null,date:today,description:'',found:{}};
  let t=normText(text).replace(/[٬،]/g,'').replace(/٫/g,'.').replace(/(\d),(?=\d{3}(?!\d))/g,'$1');
  let work=t;
  // مبلغ ترکیبی: «۲ میلیون و ۵۰۰ هزار»
  let m=work.match(/(\d+(?:\.\d+)?)\s*(میلیارد|میلیون|ملیون)\s*و\s*(\d+(?:\.\d+)?)\s*هزار/);
  if(m){out.amount=r6(+m[1]*UNIT_MUL[m[2]]+(+m[3])*1e3);work=work.replace(m[0],' ')}
  else{
    const re=/(\d+(?:\.\d+)?)\s*(میلیارد|میلیون|ملیون|هزار|k\b)?/gi;let best=null,mm;
    while((mm=re.exec(work))){
      const unit=mm[2]?mm[2].toLowerCase():null,val=+mm[1]*(unit?UNIT_MUL[unit]:1);
      const score=unit?2:1;
      if(!best||score>best.score||(score===best.score&&val>best.val))best={val,score,str:mm[0]};
    }
    if(best){out.amount=r6(best.val);work=work.replace(best.str,' ')}
  }
  work=work.replace(/(تومان|تومن|ریال|تو)\b/g,' ');
  if(/(^|\s)(دیروز)(\s|$)/.test(work)){out.date=addDays(today,-1);out.found.date=true;work=work.replace('دیروز',' ')}
  else if(/پریروز/.test(work)){out.date=addDays(today,-2);out.found.date=true;work=work.replace('پریروز',' ')}
  else if(/امروز/.test(work)){out.found.date=true;work=work.replace('امروز',' ')}
  const flat=' '+cmpText(work)+' ';
  const plus=/^\s*\+/.test(t);
  if(plus||INC_WORDS.some(w=>flat.includes(cmpText(w))))out.type='income';
  const cands=categories.filter(c=>c.active!==false&&c.type===out.type);
  let hit=null;
  for(const c of cands){
    const toks=[c.name].concat(KW[c.name]||[]);
    if(toks.some(k=>flat.includes(' '+cmpText(k))||flat.includes(cmpText(k)))){hit=c;break}
  }
  if(!hit&&out.type==='income'){} // درآمد بدون کلمه‌ی دسته → سایر
  if(!hit)hit=cands.find(c=>c.name==='سایر')||null;
  if(hit){out.categoryId=hit.id;out.found.category=cands.some(c=>c===hit)&&hit.name!=='سایر'}
  out.found.amount=out.amount!==null;
  out.description=work.replace(/^\s*\+/,'').replace(/\s+/g,' ').trim();
  return out;
}

function icsFold(line){

  for(const c of d.categories)if(!c||typeof c.id!=='string'||typeof c.name!=='string'||!['income','expense'].includes(c.type)){e.push('اطلاعات دسته‌ها نامعتبر است.');break}
  const loans=d.loans==null?[]:d.loans,cheques=d.cheques==null?[]:d.cheques;

    for(const t of o.txs||[]){if(t.type==='expense'&&inRange(t.date,mr.from,mr.to))cur.set(t.categoryId,(cur.get(t.categoryId)||0)+t.amount)}
    for(let k=1;k<=3;k++){
      const m=addMonths(tj.jy,tj.jm,-k),r=monthRange(m.jy,m.jm);let any=false;
      for(const t of o.txs||[]){if(t.type==='expense'&&inRange(t.date,r.from,r.to)){any=true;base.set(t.categoryId,(base.get(t.categoryId)||0)+t.amount)}}
      if(any)months++;
    }
    if(months>=2){
      const found=[];
      for(const [cid,sp] of cur){
        const avg=(base.get(cid)||0)/months;if(!(avg>0))continue;
        const exp=avg*bs.elapsed/bs.days;
        if(sp>=exp*1.5&&sp-exp>=avg*0.2)found.push({cid,sp,exp,ratio:sp/exp});
      }
      found.sort((a,b)=>(b.sp-b.exp)-(a.sp-a.exp));
      for(const f of found.slice(0,2)){
        out.push({id:'unusual:'+f.cid+':'+mk,sev:'warn',icon:'alert',title:'خرج غیرعادی',text:'هزینه‌ی «'+(names[f.cid]||'؟')+'» تا امروز '+F(f.sp)+' شده؛ حدود '+toFa(Math.round((f.ratio-1)*100))+'٪ بیشتر از معمولِ همین بازه در ماه‌های قبل ('+F(Math.round(f.exp))+').',act:'goTx'});
      }
    }
  }
  /* ۳) قسط، چک و پرداخت‌های نزدیک */
  const OUT=['installment','chequeOut','recurOut','debtOut'];
  const soon=(o.items||[]).filter(i=>OUT.includes(i.kind)&&i.due&&daysBetween(today,i.due)>=0&&daysBetween(today,i.due)<=7);
  if(soon.length){
    const sum=r6(soon.reduce((s,i)=>s+i.amount,0)),short=o.accountsTotal!=null?r6(sum-o.accountsTotal):0;
    if(short>0)out.push({id:'short:'+today,sev:'danger',icon:'alert',title:'احتمال کسری موجودی',text:toFa(soon.length)+' پرداخت تا ۷ روز آینده سررسید دارد (جمعاً '+F(sum)+') ولی موجودی حساب‌ها '+F(Math.max(0,o.accountsTotal))+' است؛ حدود '+F(short)+' کم می‌آید.',act:'goOb'});
    else if(soon.length>=2)out.push({id:'due:'+soon.map(i=>i.id).join(',')+':'+today,sev:'warn',icon:'cal',title:'سررسیدهای نزدیک',text:toFa(soon.length)+' قسط یا چک تا ۷ روز آینده سررسید دارد، جمعاً '+F(sum)+'. موجودی کافی است؛ فقط یادتان باشد.',act:'goOb'});
    else{const i=soon[0],d=daysBetween(today,i.due);if(d<=3)out.push({id:'due1:'+i.id+':'+i.due,sev:'info',icon:'cal',title:'سررسید نزدیک',text:'«'+i.title+'» '+(d===0?'امروز':toFa(d)+' روز دیگر')+' سررسید دارد ('+F(i.amount)+').',act:'goOb'})}
  }
  /* ۴) صندوق‌های هدف */
  const gs=(o.goals||[]).filter(g=>g.active!==false);
  for(const g of gs){
    const p=goalProgress(g,today),nm='«'+g.name+'»';
    if(p.done)continue;
    if(p.status==='overdue')out.push({id:'goalod:'+g.id,sev:'warn',icon:'target',title:'سررسید هدف گذشته',text:'موعد صندوق '+nm+' گذشته و هنوز '+F(p.remaining)+' مانده. تاریخ را تمدید کنید یا مبلغ را به‌روز کنید.',act:'goGoals'});
    else if(p.status==='behind')out.push({id:'goalbh:'+g.id+':'+mk,sev:'warn',icon:'target',title:'عقب از برنامه',text:'برای رسیدن به '+nm+' تا '+fmtJ(g.dueDate)+' ماهی حدود '+F(Math.round(p.requiredMonthly))+' لازم است'+(p.pace>0?' ولی روند ۳ ماه اخیر ماهی '+F(Math.round(p.pace))+' بوده.':' و در ۳ ماه اخیر واریزی نداشته‌اید.'),act:'goGoals'});
    else if(p.pct>=0.9)out.push({id:'goalnear:'+g.id,sev:'good',icon:'check',title:'نزدیک هدف',text:'صندوق '+nm+' به '+toFa(Math.round(p.pct*100))+'٪ رسیده؛ فقط '+F(p.remaining)+' مانده!',act:'goGoals'});
  }
  const tot=r6(gs.reduce((s,g)=>s+goalSaved(g),0));
  if(o.accountsTotal!=null&&tot>0&&tot>o.accountsTotal+1e-9)out.push({id:'goalbal:'+mk,sev:'warn',icon:'alert',title:'صندوق‌ها بیشتر از موجودی',text:'مجموع صندوق‌ها ('+F(tot)+') از موجودی حساب‌ها ('+F(Math.max(0,o.accountsTotal))+') بیشتر است؛ یعنی بخشی از پولِ کنار‌گذاشته خرج شده.',act:'goGoals'});
  /* ۵) پیام مثبت وقتی مشکلی نیست */
  if(!out.some(a=>a.sev==='danger'||a.sev==='warn')&&bs.elapsed>=3&&(o.budgets||[]).length&&bs.totalSpent>0)out.push({id:'allok:'+mk,sev:'good',icon:'check',title:'در مسیر درست',text:'تا اینجای ماه همه‌ی بودجه‌ها در مسیرند. همین‌طور ادامه بدهید.',act:'goBudget'});
  out.sort((a,b)=>SEV_RANK[a.sev]-SEV_RANK[b.sev]);
  return o.limit?out.slice(0,o.limit):out;
}
/* ---------- تبدیل واحد، Backup نسخه ۵، نمونه ---------- */
const _convert4=P4.convertAmounts,_validate4=P4.validateBackup;
function convertAmounts5(data,factor){
  const base=_convert4(data,factor);let rounded=base.rounded;
  const cv=x=>{if(typeof x!=='number')return x;const raw=x*factor,v=Math.round(raw*1e4)/1e4;if(Math.abs(v-raw)>1e-9)rounded++;return v};
  base.data.goals=(data.goals||[]).map(g=>({...g,target:cv(g.target),contribs:(g.contribs||[]).map(c=>({...c,amount:cv(c.amount)}))}));
  base.rounded=rounded;return base;
}
function validateBackup5(o){
  if(!o||typeof o!=='object'||o.app!=='malyar')return _validate4(o);
  const ver=o.version,r=_validate4(typeof ver==='number'&&ver<=SCHEMA5?{...o,version:Math.min(ver,4)}:o);
  if(!r.counts)return r;
  const e=r.errors.slice(),gl=o.data.goals==null?[]:o.data.goals;
  if(!Array.isArray(gl))e.push('اطلاعات صندوق‌های هدف نامعتبر است.');
  else{const bg=gl.filter(g=>!g||typeof g.id!=='string'||validateGoal(g).length).length;if(bg)e.push(bg+' صندوق هدف نامعتبر است.')}
  r.counts.goals=Array.isArray(gl)?gl.length:0;
  return{errors:e,counts:r.counts};
}
function makeDemoP5(o){
  const sc=o.scale||1,a=v=>Math.round(v*sc*1e4)/1e4,t=o.today,mk=x=>({...x,demo:true,active:true,createdAt:Date.now()});
  const c=(d,v,k)=>({id:'dc'+d+'-'+v,date:addDays(t,-d),amount:a(v),kind:k||'manual'});
  return{goals:[
    {id:'demo-g-1',name:'خرید گوشی',icon:'📱',target:a(40e6),startDate:addDays(t,-60),dueDate:addDays(t,120),autoPct:0,contribs:[c(55,6e6),c(20,6e6)]},
    {id:'demo-g-2',name:'صندوق اضطراری',icon:'🛡️',target:a(100e6),startDate:addDays(t,-90),dueDate:null,autoPct:10,contribs:[c(80,8e6),c(50,8e6,'auto'),c(15,9e6,'auto')]},
    {id:'demo-g-3',name:'سفر تابستان',icon:'✈️',target:a(30e6),startDate:addDays(t,-80),dueDate:addDays(t,40),autoPct:0,contribs:[c(70,3e6)]}
  ].map(mk)};
}
const P5={SCHEMA:SCHEMA5,GOAL_ICONS,validateGoal,goalSaved,goalProgress,goalsTotals,autoPctTotal,allocateIncome,smartInsights,convertAmounts:convertAmounts5,validateBackup:validateBackup5,makeDemoP5};

/* ================= فاز ۷: گروه‌های دارایی (ارز دیجیتال، بورس، نقره…) + گزارش‌گیری ================= */
const ASSET_GROUPS=[
  {id:'metal',label:'طلا، سکه و نقره',icon:'🥇'},
  {id:'fx',label:'ارز',icon:'💵'},
  {id:'crypto',label:'ارز دیجیتال',icon:'₿'},
  {id:'bourse',label:'بورس (سهام و صندوق‌ها)',icon:'📈'},
  {id:'other',label:'سایر',icon:'📦'}
];
const assetGroupOf=kind=>{const k=ASSET_KINDS[kind];return k&&k.group||'other'};
/* تجمیع دارایی‌ها بر اساس گروه: ارزش، سهم از کل و سود/زیان (فقط دارایی‌هایی که قیمت خرید دارند) */
function assetGroups(assets){
  const m=new Map();let total=0;
  for(const a of assets||[]){
    const g=assetGroupOf(a.kind);if(!m.has(g))m.set(g,{items:[],value:0,cost:0,cval:0});
    const o=m.get(g),v=assetValue(a);o.items.push(a);o.value+=v;total+=v;
    const p=assetPnl(a);if(p){o.cost+=p.cost;o.cval+=p.value}
  }
  return ASSET_GROUPS.filter(g=>m.has(g.id)).map(g=>{
    const o=m.get(g.id),pnl=o.cost>0?r6(o.cval-o.cost):null;
    return{id:g.id,label:g.label,icon:g.icon,count:o.items.length,items:o.items,value:r6(o.value),share:total>0?o.value/total:0,pnl,pct:o.cost>0?pnl/o.cost:null};
  }).sort((a,b)=>b.value-a.value);
}
/* مقدار دارایی: تا ۸ رقم اعشار (برای ارز دیجیتال) بدون صفرهای اضافی */
function fmtQty(n){
  if(typeof n!=='number'||!isFinite(n))return '—';
  const neg=n<0;n=Math.abs(n);
  const s=n.toFixed(8).replace(/\.?0+$/,''),p=s.split('.');
  const ii=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'٬');
  return (neg?'−':'')+toFa(ii+(p[1]?'٫'+p[1]:''));
}
/* ---------- گزارش‌گیری ---------- */
const SEASONS=['بهار','تابستان','پاییز','زمستان'];
const seasonOf=jm=>Math.ceil(jm/3);
/* بازه‌ی گزارش: kind = month | season | year | all | custom */
function reportPeriod(o){
  const k=o.kind;
  if(k==='month'){const r=monthRange(o.jy,o.jm);return{kind:k,from:r.from,to:r.to,label:JM[o.jm-1]+' '+toFa(o.jy),ok:true}}
  if(k==='season'){
    const m1=(o.js-1)*3+1;
    return{kind:k,from:jToIso(o.jy,m1,1),to:jToIso(o.jy,m1+2,daysInJMonth(o.jy,m1+2)),label:'فصل '+SEASONS[o.js-1]+' '+toFa(o.jy),ok:true};
  }
  if(k==='year'){const r=yearRange(o.jy);return{kind:k,from:r.from,to:r.to,label:'سال '+toFa(o.jy),ok:true}}
  if(k==='all'){
    let mn=null,mx=null;
    for(const t of o.txs||[]){if(t.type==='transfer')continue;if(!mn||t.date<mn)mn=t.date;if(!mx||t.date>mx)mx=t.date}
    const td=o.today;if(!mn){mn=td;mx=td}if(mx<td)mx=td;
    return{kind:k,from:mn,to:mx,label:'کل دوران',ok:true};
  }
  let f=o.from,t=o.to;
  if(!f||!t||!isoValid(f)||!isoValid(t))return{kind:'custom',from:f||'',to:t||'',label:'',ok:false,error:'تاریخ شروع و پایان را درست انتخاب کنید.'};
  if(f>t){const x=f;f=t;t=x}
  return{kind:'custom',from:f,to:t,label:'از '+fmtJ(f)+' تا '+fmtJ(t),ok:true};
}
/* بازه‌ی قبلی هم‌طول برای مقایسه (برای «کل دوران» ندارد) */
function prevReportRange(p,today){
  if(!p||!p.ok||p.kind==='all')return null;
  let pf,pt;
  if(p.kind==='month'){const j=isoToJ(p.from),x=addMonths(j.jy,j.jm,-1),r=monthRange(x.jy,x.jm);pf=r.from;pt=r.to}
  else if(p.kind==='season'){const j=isoToJ(p.from),x=addMonths(j.jy,j.jm,-3);pf=jToIso(x.jy,x.jm,1);const e=addMonths(x.jy,x.jm,2);pt=jToIso(e.jy,e.jm,daysInJMonth(e.jy,e.jm))}
  else if(p.kind==='year'){const j=isoToJ(p.from),r=yearRange(j.jy-1);pf=r.from;pt=r.to}
  else{const len=daysBetween(p.from,p.to)+1;pt=addDays(p.from,-1);pf=addDays(p.from,-len)}
  /* بازه‌ی در جریان: مقایسه فقط تا همان روزِ سپری‌شده */
  if(today&&p.from<=today&&p.to>today){
    const el=daysBetween(p.from,today)+1,cap=addDays(pf,el-1);if(cap<pt)pt=cap;
  }
  return{from:pf,to:pt};
}
const deltaPct=(c,p)=>p>0?(c-p)/p:null;
function buildPeriodReport(o){
  const txs=o.txs||[],today=o.today,p=o.period;
  if(!p||!p.ok)return{ok:false,error:p&&p.error||'بازه‌ی گزارش نامعتبر است.'};
  const from=p.from,to=p.to,span=daysBetween(from,to)+1;
  const totals=periodTotals(txs,from,to);
  const pr=prevReportRange(p,today),prevTotals=pr?periodTotals(txs,pr.from,pr.to):null;
  const effTo=today&&to>today?(today<from?from:today):to,elapsed=Math.max(1,daysBetween(from,effTo)+1);
  const inP=txs.filter(t=>t.type!=='transfer'&&inRange(t.date,from,to));
  const cats=type=>{
    const cur=byCategory(txs,from,to,type),prv=pr?new Map(byCategory(txs,pr.from,pr.to,type).map(x=>[x.categoryId,x.total])):null;
    const tot=type==='expense'?totals.expense:totals.income;
    return cur.map(x=>({categoryId:x.categoryId,total:x.total,share:tot>0?x.total/tot:0,prev:prv?(prv.get(x.categoryId)||0):null,delta:prv?deltaPct(x.total,prv.get(x.categoryId)||0):null}));
  };
  /* نمودار: روزانه (تا ۴۵ روز)، ماهانه (تا ۴۸ ماه) یا سالانه */
  const j1=isoToJ(from),j2=isoToJ(to),months=(j2.jy-j1.jy)*12+(j2.jm-j1.jm)+1;
  const gran=span<=45?'day':months<=48?'month':'year';
  const bk=[],idx=new Map();
  if(gran==='day'){for(let i=0;i<span;i++){const d=addDays(from,i);idx.set(d,bk.length);bk.push({key:d,label:toFa(isoToJ(d).jd),title:fmtJ(d),income:0,expense:0})}}
  else if(gran==='month'){for(let i=0;i<months;i++){const x=addMonths(j1.jy,j1.jm,i);idx.set(x.jy*100+x.jm,bk.length);bk.push({key:x.jy*100+x.jm,label:JM[x.jm-1],title:JM[x.jm-1]+' '+toFa(x.jy),jy:x.jy,jm:x.jm,income:0,expense:0})}}
  else{for(let y=j1.jy;y<=j2.jy;y++){idx.set(y,bk.length);bk.push({key:y,label:toFa(y),title:'سال '+toFa(y),income:0,expense:0})}}
  const dayExp=new Map();
  for(const t of inP){
    const j=isoToJ(t.date),i=idx.get(gran==='day'?t.date:gran==='month'?j.jy*100+j.jm:j.jy);
    if(i===undefined)continue;
    if(t.type==='income')bk[i].income+=t.amount;else{bk[i].expense+=t.amount;dayExp.set(t.date,(dayExp.get(t.date)||0)+t.amount)}
  }
  bk.forEach(b=>{b.income=r6(b.income);b.expense=r6(b.expense);b.net=r6(b.income-b.expense)});
  let busiest=null;for(const[d,v]of dayExp)if(!busiest||v>busiest.total)busiest={date:d,total:r6(v)};
  const exps=inP.filter(t=>t.type==='expense').sort((a,b)=>b.amount-a.amount||(a.date<b.date?1:-1)),incs=inP.filter(t=>t.type==='income').sort((a,b)=>b.amount-a.amount);
  const mini=t=>({id:t.id,date:t.date,amount:t.amount,description:t.description||'',categoryId:t.categoryId||''});
  /* موجودی حساب‌ها در ابتدا و انتهای بازه */
  const accs=o.accounts||[],opn=E_balances(accs,txs.filter(t=>t.date<from)),cls=E_balances(accs,txs.filter(t=>t.date<=to));
  const accRows=accs.map(a=>({id:a.id,opening:opn[a.id]||0,closing:cls[a.id]||0}));
  const sumOf=k=>r6(accRows.reduce((s,a)=>s+a[k],0));
  return{ok:true,period:p,from,to,span,elapsed,partial:!!(today&&p.from<=today&&p.to>today),
    totals,prev:pr,prevTotals,
    delta:prevTotals?{income:deltaPct(totals.income,prevTotals.income),expense:deltaPct(totals.expense,prevTotals.expense),net:prevTotals.net!==0?(totals.net-prevTotals.net)/Math.abs(prevTotals.net):null}:null,
    avgDaily:r6(totals.expense/elapsed),avgMonthly:span>=28?r6(totals.expense/Math.max(1,elapsed/30.4375)):null,
    expenseCount:exps.length,incomeCount:incs.length,
    expenseCats:cats('expense'),incomeCats:cats('income'),
    gran,buckets:bk,busiest,
    topExpenses:exps.slice(0,10).map(mini),topIncomes:incs.slice(0,5).map(mini),
    accounts:accRows,openingTotal:sumOf('opening'),closingTotal:sumOf('closing'),
    txCount:inP.length};
}
function E_balances(accs,txs){return balances(accs,txs)}
const P6={ASSET_GROUPS,assetGroupOf,assetGroups,fmtQty,SEASONS,seasonOf,reportPeriod,prevReportRange,buildPeriodReport,deltaPct};

return Object.assign(BASE,ADD,P3,P4,P5,P6);
})();

</script>
<script id="dbmod">
const DB=(function(){
'use strict';
const STORES=['transactions','accounts','categories','settings','loans','cheques','budgets','recurring','assets','debts','goals'];
const KEY={transactions:'id',accounts:'id',categories:'id',settings:'key',loans:'id',cheques:'id',budgets:'id',recurring:'id',assets:'id',debts:'id',goals:'id'};
let db=null,mem=null;
function mkMem(){const m={};STORES.forEach(s=>m[s]=new Map());return m}
function open(){
  return new Promise(res=>{
    const fail=()=>{mem=mkMem();res(false)};
    try{
      if(!window.indexedDB)return fail();
      const req=indexedDB.open('PersonalFinanceDB',5);
      req.onupgradeneeded=()=>{const d=req.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:KEY[s]})})};
      req.onsuccess=()=>{db=req.result;res(true)};
      req.onerror=fail;req.onblocked=fail;
    }catch(e){fail()}
  });
}
const done=tx=>new Promise((res,rej)=>{tx.oncomplete=()=>res();tx.onerror=tx.onabort=()=>rej(tx.error||new Error('خطای ذخیره‌سازی'))});
async function getAll(s){
  if(mem)return[...mem[s].values()].map(x=>JSON.parse(JSON.stringify(x)));
  return new Promise((res,rej)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
}
async function putMany(s,arr){
  if(mem){arr.forEach(o=>mem[s].set(o[KEY[s]],JSON.parse(JSON.stringify(o))));return}
  const tx=db.transaction(s,'readwrite'),st=tx.objectStore(s);arr.forEach(o=>st.put(o));return done(tx);
}
const put=(s,o)=>putMany(s,[o]);
async function del(s,key){
  if(mem){mem[s].delete(key);return}
  const tx=db.transaction(s,'readwrite');tx.objectStore(s).delete(key);return done(tx);
}
async function delMany(s,keys){
  if(mem){keys.forEach(k=>mem[s].delete(k));return}
  const tx=db.transaction(s,'readwrite'),st=tx.objectStore(s);keys.forEach(k=>st.delete(k));return done(tx);
}
/* جایگزینی کامل همه‌ی استورها در یک تراکنش اتمیک */
/* ردیف‌های تنظیمات که با بازیابی/پاک‌کردن داده نباید از بین بروند (لایسنس دستگاه) */
const KEEP_SETTINGS=['license'];
async function replaceAll(data){
  const keep=(await getAll('settings')).filter(r=>KEEP_SETTINGS.includes(r.key));
  data=Object.assign({},data,{settings:(data.settings||[]).filter(r=>!KEEP_SETTINGS.includes(r.key)).concat(keep)});
  if(mem){STORES.forEach(s=>{mem[s]=new Map();(data[s]||[]).forEach(o=>mem[s].set(o[KEY[s]],JSON.parse(JSON.stringify(o))))});return}
  const tx=db.transaction(STORES,'readwrite');
  STORES.forEach(s=>{const st=tx.objectStore(s);st.clear();(data[s]||[]).forEach(o=>st.put(o))});
  return done(tx);
}
return{open,getAll,put,putMany,del,delMany,replaceAll,isMemory:()=>!!mem};
})();

</script>
<script id="app">
(function(){
'use strict';
const BRAND=window.__BRAND||'';
const APP_VERSION='6.2.0';

function barChart(series){
  const W=640,H=224,pl=6,pr=6,pt=12,pb=34,n=series.length,hh=H-pt-pb;
  const max=Math.max(1,...series.map(s=>Math.max(s.income,s.expense)));
  const gw=(W-pl-pr)/n,bw=Math.min(24,gw/3.1);
  let g='<defs><linearGradient id="gi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--income)"/><stop offset="1" style="stop-color:var(--income);stop-opacity:.55"/></linearGradient><linearGradient id="ge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--expense)"/><stop offset="1" style="stop-color:var(--expense);stop-opacity:.55"/></linearGradient></defs>';
  for(let i=0;i<=3;i++){const y=pt+hh*(i/3);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-dasharray="2 5"/>'}
  series.forEach((s,i)=>{
    const cx=W-pr-gw*(i+.5),on=(s.jy===V.jy&&s.jm===V.jm),hi=hh*s.income/max,he=hh*s.expense/max;
    if(on)g+='<rect x="'+(cx-gw/2+4)+'" y="'+pt+'" width="'+(gw-8)+'" height="'+hh+'" rx="14" fill="var(--accent-soft)"/>';
    g+='<rect x="'+(cx-bw-2)+'" y="'+(pt+hh-hi)+'" width="'+bw+'" height="'+Math.max(hi,s.income>0?3:0)+'" rx="6" fill="url(#gi)"><title>'+esc(s.label+' | درآمد: '+money(s.income))+'</title></rect>';
    g+='<rect x="'+(cx+2)+'" y="'+(pt+hh-he)+'" width="'+bw+'" height="'+Math.max(he,s.expense>0?3:0)+'" rx="6" fill="url(#ge)"><title>'+esc(s.label+' | هزینه: '+money(s.expense))+'</title></rect>';
    g+='<text x="'+cx+'" y="'+(H-11)+'" text-anchor="middle" font-size="12.5" fill="'+(on?'var(--accent)':'var(--muted)')+'" font-weight="'+(on?800:500)+'">'+esc(s.label)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="نمودار درآمد و هزینه‌ی ماهانه">'+g+'</svg>';
}
function donut(items,total){
  const R_=60,C=2*Math.PI*R_;let off=0,segs='';
  items.forEach(it=>{const len=Math.max(C*it.total/total-2.5,0.5);segs+='<circle r="'+R_+'" cx="80" cy="80" fill="none" stroke="'+it.color+'" stroke-width="17" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 80 80)"><title>'+esc(it.name+': '+money(it.total))+'</title></circle>';off+=C*it.total/total});
  return '<svg viewBox="0 0 160 160" width="164" height="164" role="img" aria-label="هزینه‌ها بر اساس دسته">'+segs+'<text x="80" y="76" text-anchor="middle" font-size="9.5" fill="var(--muted)">جمع هزینه</text><text x="80" y="95" text-anchor="middle" font-size="13" font-weight="800" fill="var(--text)">'+E.fmtCompact(total)+'</text></svg>';
}
function spark(series){
  const W=300,H=46,n=series.length,vals=series.map(s=>s.net),mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1,step=n>1?W/(n-1):W;
  const pts=vals.map((v,i)=>[W-i*step,H-5-(v-mn)/rg*(H-14)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+' L'+pts[n-1][0].toFixed(1)+' '+H+' L'+pts[0][0].toFixed(1)+' '+H+'z';
  const last=pts[n-1];
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2b84b" stop-opacity=".35"/><stop offset="1" stop-color="#f2b84b" stop-opacity="0"/></linearGradient></defs><path d="'+area+'" fill="url(#sg)"/><path d="'+line+'" fill="none" stroke="#f2b84b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="3.2" fill="#f2b84b" vector-effect="non-scaling-stroke"/></svg>';
}

function periodRange(p){
  const j=E.isoToJ(today());
  if(p==='month')return E.monthRange(j.jy,j.jm);
  if(p==='prev'){const x=E.addMonths(j.jy,j.jm,-1);return E.monthRange(x.jy,x.jm)}
  if(p==='year')return E.yearRange(j.jy);
  if(p==='prevyear')return E.yearRange(j.jy-1);
  return{from:null,to:null};
}
function filteredTx(){
  const r=periodRange(F.period),q=E.cmpText(F.q.trim());
  let a=S.txs.filter(t=>{
    if(!E.inRange(t.date,r.from,r.to))return false;
    if(F.type!=='all'&&t.type!==F.type)return false;
    if(F.cat!=='all'&&t.categoryId!==F.cat)return false;
    if(F.acc!=='all'&&t.accountId!==F.acc&&t.sourceAccountId!==F.acc&&t.destinationAccountId!==F.acc)return false;
    if(q){const c=S.cM.get(t.categoryId);const hay=E.cmpText((t.description||'')+' '+(t.note||'')+' '+(c?c.name:'')+' '+t.amount+' '+E.fmtJ(t.date));if(!hay.includes(q))return false}
    return true;
  });
  if(F.sort==='new')a=sortedTx(a);else if(F.sort==='old')a=sortedTx(a).reverse();else if(F.sort==='big')a.sort((x,y)=>y.amount-x.amount);else a.sort((x,y)=>x.amount-y.amount);
  return a;
}

  const r=E.parseQuick(v,S.categories,today());
  if(r.type!==D.type){readForm();D.type=r.type;D.categoryId='';const keep=v;$('#overlay .sheet').innerHTML=sheetHtml();$('#fquick').value=keep;$('#fquick').focus()}
  if(r.amount!==null)$('#famount').value=String(r.amount);
  if(r.categoryId&&$('#fcat'))$('#fcat').value=r.categoryId;
  $('#fdate').value=E.fmtJ(r.date);$('#fdesc').value=r.description;updHints();
  const c=S.cM.get(r.categoryId);
  $('#qhint').textContent=(r.amount!==null?'مبلغ '+E.fmtNum(r.amount):'مبلغی پیدا نشد')+(c?' | '+c.name:'')+' | '+(r.type==='income'?'درآمد':'هزینه');
}
async function quickNewCat(){
  readForm();
  const name=await promptText('دسته‌ی جدید ('+(D.type==='income'?'درآمد':'هزینه')+')','نام دسته','مثلاً: ورزش');
  const sel=$('#fcat');
  if(!name){if(sel)sel.innerHTML=catOptions(D.type,D.categoryId||D._defCat);return}
  let c=S.categories.find(x=>x.type===D.type&&x.name===name);
  if(!c){
    c={id:uid(),name,type:D.type,active:true,icon:'🏷️',color:CAT_COLORS[S.categories.length%CAT_COLORS.length],createdAt:Date.now()};
    await DB.put('categories',c);S.categories.push(c);reindex();toast('دسته‌ی «'+name+'» اضافه شد');
  }
  D.categoryId=c.id;if(sel)sel.innerHTML=catOptions(D.type,c.id);
}
async function saveTx(keepOpen){
  readForm();
  const amount=E.parseAmount(D.amount);
  const tx={id:D.id||uid(),type:D.type,amount,date:D.dateIso,description:(D.description||'').trim(),note:D.note||'',createdAt:D.createdAt||Date.now(),updatedAt:Date.now()};
  if(D.demo)tx.demo=true;if(D.loanId){tx.loanId=D.loanId;tx.installmentNo=D.installmentNo}if(D.chequeId)tx.chequeId=D.chequeId;if(D.recurringId){tx.recurringId=D.recurringId;tx.recurringDate=D.recurringDate}if(D.debtId){tx.debtId=D.debtId;if(D.debtPayId)tx.debtPayId=D.debtPayId;if(D.debtOrigin)tx.debtOrigin=true}if(D.smsSig)tx.smsSig=D.smsSig
  const _ng=$('#fgoal');if(_ng?!_ng.checked:D.noGoal)tx.noGoal=true;
  if(D.type==='transfer'){tx.sourceAccountId=D.src;tx.destinationAccountId=D.dst;tx.accountId=null;tx.categoryId=null}else{tx.accountId=D.accountId;tx.categoryId=D.categoryId||D._defCat||''}
  const dj=E.parseJDate($('#fdate').value);
  const errs=E.validateTx(dj?tx:{...tx,date:'x'},{accounts:S.accounts,categories:S.categories});
  if(errs.length){showErr(errs);return}
  try{await DB.put('transactions',tx)}catch(e){showErr(['ذخیره انجام نشد. دوباره تلاش کنید.']);return}
  const i=S.txs.findIndex(x=>x.id===tx.id);if(i>=0)S.txs[i]=tx;else S.txs.push(tx);
  try{if(D.id)await goalUndoTx(tx.id);if(tx.type==='income'&&!tx.noGoal){const al=await goalAutoAlloc([tx]);if(al.length)toast('به صندوق‌ها رفت: '+al.map(a=>a.name+' '+E.fmtNum(a.amount)).join('، '))}}catch(e){}
  if(tx.accountId){S.st.lastAccountId=tx.accountId;saveSt()}
  toast(D.id?'تغییرات ذخیره شد':'تراکنش ثبت شد');
  if(keepOpen&&!D.id){const t=D.type,a=D.accountId;D=newDraft(t,{accountId:a});$('#overlay .sheet').innerHTML=sheetHtml();updHints();$('#fquick').focus()}else closeSheet();
  render();
}
async function deleteTx(id){
  const t=S.txs.find(x=>x.id===id);
  const linked=t&&(t.loanId||t.chequeId||t.recurringId||t.debtPayId);
  if(!await ask('حذف تراکنش',linked?'این تراکنش به یک قسط، چک یا تکراری وصل است. با حذف آن، همان سررسید دوباره «انجام‌نشده» می‌شود.':'این تراکنش برای همیشه حذف می‌شود.','حذف',true))return;
  try{
    await DB.del('transactions',id);await goalUndoTx(id);
    if(t&&t.loanId){const l=S.loans.find(x=>x.id===t.loanId);if(l){const ins=l.installments.find(i=>i.txId===id);if(ins){ins.paid=false;ins.paidDate=null;ins.paidAmount=null;ins.txId=null;await DB.put('loans',l)}}}
    if(t&&t.recurringId){const r=S.recurring.find(x=>x.id===t.recurringId);if(r&&r.doneDates){r.doneDates=r.doneDates.filter(d=>d!==t.recurringDate);await DB.put('recurring',r)}}
    if(t&&t.debtPayId){const dd=S.debts.find(x=>x.id===t.debtId);if(dd){dd.payments=(dd.payments||[]).filter(pp=>pp.id!==t.debtPayId);await DB.put('debts',dd)}}
    if(t&&t.chequeId){const c=S.cheques.find(x=>x.id===t.chequeId);if(c){c.status='pending';c.txId=null;c.clearedDate=null;await DB.put('cheques',c)}}
  }catch(e){toast('حذف انجام نشد');return}
  S.txs=S.txs.filter(x=>x.id!==id);closeSheet();toast('حذف شد');render();
}

/* ================= بودجه ================= */
function budgetStat(){const r=E.monthRange(V.jy,V.jm);return E.budgetStatus(S.budgets,S.txs,r.from,r.to,today())}
function budName(id){if(id==='total')return 'کل هزینه‌های ماه';const c=S.cM.get(id);return c?c.name:'—'}
function budColor(l){return l==='over'?'var(--danger)':l==='warn'?'var(--gold)':'var(--accent)'}
function budMsg(r,cur){
  if(r.level==='over')return '<b class="dng">'+E.fmtNum(-r.remaining)+' '+esc(unit())+' بیشتر از سقف</b>';
  return 'مانده: <b>'+E.fmtNum(r.remaining)+'</b>'+(cur&&r.perDay?' <span class="faint">· روزی '+E.fmtNum(Math.floor(r.perDay))+'</span>':'');
}
function budTag(r,cur){
  if(r.level==='over')return '<span class="pill bad">از سقف گذشت</span>';
  if(r.level==='warn')return '<span class="pill warn">نزدیک سقف</span>';
  if(cur&&r.willExceed)return '<span class="pill warn">با این روند از سقف می‌گذرد</span>';
  return '';
}
function budRow(r,cur){
  const isT=r.id==='total',c=isT?null:S.cM.get(r.id);if(!isT&&!c)return '';
  return '<div class="rw bud" role="button" tabindex="0" data-act="editBud" data-id="'+esc(r.id)+'"><div class="ico" style="--c:'+(isT?'var(--accent)':catColor(c))+'">'+(isT?ic('target',20):esc(c.icon||'📦'))+'</div><div class="mid"><div class="bh"><b>'+esc(budName(r.id))+'</b><span class="n">'+E.fmtNum(r.spent)+' <small class="muted">از '+E.fmtNum(r.limit)+'</small></span></div><div class="prog" style="margin:8px 0 6px"><i style="width:'+Math.min(100,Math.round(r.pct*100))+'%;background:'+budColor(r.level)+'"></i></div><div class="bm"><span>'+budMsg(r,cur)+'</span>'+budTag(r,cur)+'</div></div></div>';
}
function viewBudget(){
  const bs=budgetStat(),cur=isNowMonth(),rows=bs.rows.filter(r=>r.id==='total'||S.cM.has(r.id));
  let h='<div class="view"><div class="head"><div><h1>بودجه‌ی ماهانه</h1><div class="sub">برای هر دسته سقف بگذارید؛ نزدیک شدن به سقف را زودتر می‌بینید</div></div><div class="row" style="gap:10px;flex-wrap:wrap">'+monthNav()+'<button class="btn primary" data-act="addBud">'+ic('plus',18)+'بودجه‌ی جدید</button></div></div>';
  if(!rows.length){
    return h+'<div class="card empty"><div class="em">'+ic('target',30)+'</div><h2>هنوز بودجه‌ای تعریف نکرده‌اید</h2><p>برای هر دسته‌ی هزینه (مثلاً خوراک یا تفریح) یک سقف ماهانه بگذارید. برنامه وقتی به ۸۰٪ برسید هشدار می‌دهد و می‌گوید تا آخر ماه روزی چقدر می‌توانید خرج کنید.</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="budSuggest">'+ic('trend',18)+'پیشنهاد خودکار از ۳ ماه گذشته</button><button class="btn" data-act="addBud">تعریف دستی</button></div></div></div>';
  }
  const tot=rows.find(r=>r.id==='total')||(()=>{const cr=rows.filter(r=>r.id!=='total'),limit=cr.reduce((s,r)=>s+r.limit,0),spent=cr.reduce((s,r)=>s+r.spent,0);return{limit,spent,remaining:limit-spent,pct:limit?spent/limit:0,level:spent>=limit?'over':spent>=limit*E.BUDGET_WARN?'warn':'ok',perDay:0,agg:true}})();
  const left=bs.left;
  h+='<section class="card bud-sum" style="--c:'+budColor(tot.level)+'"><div class="muted small">'+(tot.agg?'جمع بودجه‌ی دسته‌ها':'بودجه‌ی کل ماه')+'</div><div class="bh" style="align-items:baseline"><div style="font-size:1.55rem;font-weight:800">'+E.fmtNum(tot.spent)+' <small class="muted" style="font-size:.9rem">از '+E.fmtNum(tot.limit)+' '+esc(unit())+'</small></div><b style="color:var(--c)">'+E.toFa(Math.round(tot.pct*100))+'٪</b></div><div class="prog lg" style="margin:10px 0"><i style="width:'+Math.min(100,Math.round(tot.pct*100))+'%;background:var(--c)"></i></div><div class="small muted">'+(tot.level==='over'?'<b class="dng">'+E.fmtNum(-tot.remaining)+' '+esc(unit())+' از سقف گذشته‌اید.</b>':'مانده: <b>'+E.fmtNum(tot.remaining)+'</b> '+esc(unit())+(cur&&left>0&&tot.remaining>0?' | تا آخر ماه '+E.toFa(left)+' روز، روزی '+E.fmtNum(Math.floor(tot.remaining/left)):''))+'</div></section>';
  h+='<section class="card sec" style="padding:4px 16px"><div class="rows">'+rows.filter(r=>r.id!=='total'||!tot.agg).map(r=>budRow(r,cur)).join('')+'</div></section>';
  const r=E.monthRange(V.jy,V.jm),budIds=new Set(S.budgets.map(b=>b.id)),un=E.byCategory(S.txs,r.from,r.to,'expense').filter(x=>!budIds.has(x.categoryId));
  if(un.length&&!budIds.has('total')){
    const s=un.reduce((a,x)=>a+x.total,0);
    h+='<div class="card flat sec small" style="display:flex;gap:10px;align-items:center">'+ic('alert',18)+'<span>هزینه‌ی دسته‌های بدون بودجه در این ماه: <b>'+E.fmtNum(s)+'</b> '+esc(unit())+' ('+un.slice(0,3).map(x=>esc(budName(x.categoryId))).join('، ')+'). برای کنترل بیشتر برای آن‌ها هم سقف بگذارید.</span></div>';
  }
  h+='<div class="row sec"><button class="btn" data-act="budSuggest">'+ic('trend',16)+'پیشنهاد خودکار از ۳ ماه گذشته</button></div>';
  return h+'</div>';
}

async function saveBud(){
  const id=D.bud.id||$('#bsel').value,amount=readAmt('bamt'),ex=S.budgets.find(b=>b.id===id);
  const b=Object.assign({createdAt:Date.now()},ex||{},{id,amount});

  try{await DB.put('budgets',b)}catch(x){showErr(['ذخیره انجام نشد.']);return}
  if(ex)Object.assign(ex,b);else S.budgets.push(b);

}
async function delBud(id){
  if(!await ask('حذف بودجه','سقف «'+budName(id)+'» حذف می‌شود. تراکنش‌ها تغییری نمی‌کنند.','حذف',true))return;
  await DB.del('budgets',id);S.budgets=S.budgets.filter(b=>b.id!==id);closeSheet();toast('بودجه حذف شد');render();

function openBudSuggest(){
  const sg=E.suggestBudgets(S.txs,V.jy,V.jm,3,BUD_STEP()).filter(x=>S.cM.has(x.categoryId)).slice(0,12);
  if(!sg.length){openSheet('<h2>پیشنهاد خودکار</h2><p class="muted">برای پیشنهاد، حداقل یک ماه تراکنش هزینه در ۳ ماه گذشته لازم است. فعلاً بودجه را دستی تعریف کنید.</p><div class="row end"><button class="btn" data-act="closeSheet">بستن</button></div>');return}

  openSheet('<h2>پیشنهاد بودجه</h2><p class="muted small" style="margin:-6px 0 12px">بر اساس میانگین هزینه‌ی ۳ ماه گذشته (به‌اضافه‌ی ۵٪ حاشیه). مبلغ‌ها را ویرایش یا موردی را حذف تیک کنید.</p><div id="ferr"></div><div class="sug">'+sg.map((x,i)=>{const c=S.cM.get(x.categoryId),has=S.budgets.some(b=>b.id===x.categoryId);return '<div class="sugrow"><label class="chk" style="margin:0"><input type="checkbox" id="sgc'+i+'"'+(has?'':' checked')+'><span>'+esc((c.icon||'')+' '+c.name)+'</span></label><div style="flex:1;max-width:170px"><input class="inp" id="sg'+i+'" data-amt inputmode="decimal" value="'+x.amount+'"></div></div><div class="hint" style="margin:-4px 0 8px" id="sg'+i+'-h"></div>'}).join('')+'</div><p class="hint">'+(sg.some(x=>S.budgets.some(b=>b.id===x.categoryId))?'برای دسته‌هایی که بودجه دارند، تیک پیش‌فرض خاموش است.':'')+'</p><div class="row end foot"><button class="btn" data-act="closeSheet">بستن</button><button class="btn primary" data-act="budSuggestApply">اعمال بودجه‌ها</button></div>');
  document.querySelectorAll('#overlay [data-amt]').forEach(hintAmt);
}
async function applyBudSuggest(){
  const out=[];
  for(let i=0;i<D.sg.length;i++){
    if(!$('#sgc'+i).checked)continue;
    const a=readAmt('sg'+i);if(!(a>0)){showErr(['مبلغ همه‌ی موارد انتخاب‌شده باید معتبر باشد.']);return}
    const id=D.sg[i].categoryId,ex=S.budgets.find(b=>b.id===id);out.push(Object.assign({createdAt:Date.now()},ex||{},{id,amount:a}));
  }
  if(!out.length){showErr(['موردی انتخاب نشده است.']);return}
  await DB.putMany('budgets',out);
  out.forEach(b=>{const i=S.budgets.findIndex(x=>x.id===b.id);if(i>=0)S.budgets[i]=b;else S.budgets.push(b)});
  closeSheet();toast(E.toFa(out.length)+' بودجه ثبت شد');render();
}

function obRecurring(){
  if(!S.recurring.length)return '<div class="card empty"><div class="em">'+ic('repeat',30)+'</div><h2>تراکنش تکراری ندارید</h2><p>اجاره، قبض، اشتراک یا حقوق را یک‌بار تعریف کنید؛ هر ماه در سررسیدها ظاهر می‌شود و با یک لمس ثبت می‌شود (یا اگر بخواهید، خودکار ثبت می‌شود). پیش‌بینی نقدینگی هم از آن‌ها استفاده می‌کند.</p><button class="btn primary" data-act="addRec">'+ic('plus',18)+'تکراری جدید</button></div>';

async function autoPostRecurring(){
  const t=today(),made=[],touched=new Set();
  for(const r of S.recurring){
    if(r.active===false||!r.autoPost||!S.aM.has(r.accountId)||!S.cM.has(r.categoryId))continue;
    for(const it of E.pendingRecurring([r],t,0,lead())){
      if(it.due>t)continue;
      const tx={id:uid(),type:r.type,amount:r.amount,date:it.due,accountId:r.accountId,categoryId:r.categoryId,description:r.name,note:'',recurringId:r.id,recurringDate:it.due,createdAt:Date.now(),updatedAt:Date.now()};
      if(r.demo)tx.demo=true;
      if(E.validateTx(tx,{accounts:S.accounts,categories:S.categories}).length)continue;
      made.push(tx);r.doneDates=(r.doneDates||[]).concat(it.due);touched.add(r);
    }
  }
  if(!made.length)return;
  try{await DB.putMany('transactions',made);await DB.putMany('recurring',[...touched])}catch(e){return}
  S.txs=S.txs.concat(made);try{await goalAutoAlloc(made.filter(t=>t.type==='income'))}catch(e){}toast(E.toFa(made.length)+' تراکنش تکراری خودکار ثبت شد');render();
}

function fcChart(f,habit){

  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="direction:ltr" role="img" aria-label="نمودار پیش‌بینی موجودی">'+g+'</svg>';

  return 'h0:'+hash(salt+pin)+'-'+hash(pin+salt+pin);
}

  if(Date.now()<lockUntil){if(msg)msg.textContent='چند ثانیه صبر کنید ('+E.toFa(Math.ceil((lockUntil-Date.now())/1000))+')';return}
  if(v==='⌫'){lockBuf=lockBuf.slice(0,-1);if(msg)msg.textContent='';const d=$('#ldots');if(d)d.innerHTML=lockDots();return}
  if(lockBuf.length>=(S.st.pinLen||4))return;
  lockBuf+=v;const d=$('#ldots');if(d)d.innerHTML=lockDots();
  if(lockBuf.length===(S.st.pinLen||4)){
    lockBusy=true;const pin=lockBuf,ok=await tryUnlock(pin);lockBusy=false;
    if(!ok){lockBuf='';lockFails++;const dd=$('#ldots');if(dd){dd.classList.add('shake');setTimeout(()=>{dd.classList.remove('shake');dd.innerHTML=lockDots()},420)}
      if(lockFails>=5){lockUntil=Date.now()+30000;lockFails=0;if(msg)msg.textContent='تلاش‌های ناموفق زیاد؛ ۳۰ ثانیه صبر کنید.'}else if(msg)msg.textContent='PIN اشتباه است.'}
  }
}

/* پنهان‌کردن مبلغ‌ها در حالت حریم خصوصی */
const AMT_RE=/[۰-۹]{1,3}(?:,[۰-۹]{3})+|[۰-۹٫]+\s?(?:میلیارد|میلیون|هزار)/g;
let masking=false;
function maskAmounts(){
  if(!S.st.hideAmt||masking||S.locked)return;
  masking=true;
  try{for(const sel of ['#main','#side']){const root=$(sel);if(!root)continue;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];let n;while((n=w.nextNode()))L.push(n);
    for(const t of L){const v=t.nodeValue;if(v&&/[۰-۹]/.test(v)){const nv=v.replace(AMT_RE,'•••');if(nv!==v)t.nodeValue=nv}}}}finally{masking=false}
}
function initMask(){
  try{const mo=new MutationObserver(()=>{if(S.st.hideAmt)maskAmounts()});mo.observe($('#main'),{childList:true,subtree:true})}catch(e){}
  document.addEventListener('visibilitychange',()=>{
    if(!S.st.pinHash)return;
    if(document.hidden)S.hiddenAt=Date.now();
    else if(S.hiddenAt&&!S.locked&&Date.now()-S.hiddenAt>=(S.st.autoLockMin||0)*60000)lockNow();
  });
  document.addEventListener('keydown',e=>{
    if(!S.locked)return;
    const k=E.toEn(e.key);
    if(/^\d$/.test(k)){e.preventDefault();lockKey(k)}else if(e.key==='Backspace'){e.preventDefault();lockKey('⌫')}
  },true);
}

const fsSupported=()=>typeof window.showSaveFilePicker==='function';
async function initFs(){
  S.fs=null;
  const orig={};['put','putMany','del','delMany','replaceAll'].forEach(k=>{orig[k]=DB[k]});
  ['put','putMany','del','delMany'].forEach(k=>{DB[k]=async function(){const r=await orig[k].apply(DB,arguments);scheduleAutoSave();return r}});
  DB.replaceAll=async function(data){
    if(S.fs&&S.fs.handle&&data.settings&&!data.settings.some(r=>r.key==='fsHandle'))data=Object.assign({},data,{settings:data.settings.concat([{key:'fsHandle',value:S.fs.handle}])});

      if(!data.settings||!data.settings.some(x=>x.key==='fsHandle'))throw e;
      r=await orig.replaceAll.call(DB,Object.assign({},data,{settings:data.settings.filter(x=>x.key!=='fsHandle')}));

  };

function smsKey(desc){return E.cmpText(String(desc||'')).split(/\s+/).filter(Boolean).slice(0,2).join(' ')}
function smsGuessCat(type,desc,raw){
  const rules=S.st.smsRules||{},k=smsKey(desc);
  if(k&&rules[k]){const c=S.cM.get(rules[k]);if(c&&c.type===type&&c.active!==false)return c.id}
  const hay=E.normText((desc||'')+' '+(raw||''));
  for(const[tp,re,nm]of SMS_CAT_HINTS){if(tp!==type)continue;if(re.test(hay)){const c=S.categories.find(x=>x.type===type&&x.name===nm&&x.active!==false);if(c)return c.id}}
  const f=S.categories.find(x=>x.type===type&&x.name==='سایر'&&x.active!==false)||S.categories.find(x=>x.type===type&&x.active!==false);
  return f?f.id:'';
}
function smsMatchAcc(r){
  if(r.last4){const a=activeAccs().find(x=>x.last4&&x.last4===r.last4);if(a)return a.id}
  if(r.bankName){const m=activeAccs().filter(x=>x.bankName&&x.bankName.replace(/[‌ ]/g,'')===r.bankName.replace(/[‌ ]/g,''));if(m.length===1)return m[0].id}

}

async function smsSaveAll(){

  const rules=Object.assign({},S.st.smsRules||{},learned),keys=Object.keys(rules);

function buildQueue(){

  const all=E.upcomingAll(S.loans,S.cheques,S.recurring,t,45,L,S.debts);

    if(it.days<0)return;

/* تبدیل عددهای حرفی فارسی در متن گفتاری به رقم: «دو میلیون و پانصد هزار تومان ناهار» → «2500000 تومان ناهار»
   فقط وقتی تبدیل می‌کند که عدد «مبلغ‌گونه» باشد (واحد هزار/میلیون/میلیارد، صدگان یا ≥۲۰)؛ تا «یک ناهار» یا «دو تا نان» دست نخورد. */
function faNumWords(text){
  const ONES={'صفر':0,'یک':1,'دو':2,'سه':3,'چهار':4,'پنج':5,'شش':6,'شیش':6,'هفت':7,'هشت':8,'نه':9,'ده':10,'یازده':11,'دوازده':12,'سیزده':13,'چهارده':14,'پانزده':15,'پونزده':15,'شانزده':16,'شونزده':16,'هفده':17,'هجده':18,'هیجده':18,'نوزده':19};
  const TENS={'بیست':20,'سی':30,'چهل':40,'پنجاه':50,'شصت':60,'هفتاد':70,'هشتاد':80,'نود':90};
  const HUND={'صد':100,'یکصد':100,'دویست':200,'سیصد':300,'چهارصد':400,'پانصد':500,'پانصد':500,'ششصد':600,'شیشصد':600,'هفتصد':700,'هشتصد':800,'نهصد':900};
  const MAG={'هزار':1e3,'میلیون':1e6,'ملیون':1e6,'میلیارد':1e9};
  const kind=t=>t in ONES?'o':t in TENS?'t':t in HUND?'h':t in MAG?'m':/^\d+(\.\d+)?$/.test(t)?'d':t==='نیم'?'half':t==='و'?'and':'';
  const val=t=>ONES[t]!==undefined?ONES[t]:TENS[t]!==undefined?TENS[t]:HUND[t]!==undefined?HUND[t]:+t;
  const toks=String(text||'').replace(/[٬،,]/g,'').replace(/\s+/g,' ').trim().split(' ');
  const out=[];let i=0;
  while(i<toks.length){
    const k=kind(toks[i]);
    if(!k||k==='and'||k==='half'){out.push(toks[i]);i++;continue}
    let j=i,run=[];
    while(j<toks.length){
      const kk=kind(toks[j]);
      if(kk&&kk!=='and'){run.push(toks[j]);j++}
      else if(kk==='and'&&j+1<toks.length&&kind(toks[j+1])&&kind(toks[j+1])!=='and'&&run.length){run.push('و');j++}
      else break;
    }
    /* «و» انتهایی که به عدد بعدی وصل نیست، به متن برمی‌گردد */
    let total=0,cur=0,hasWord=false,hasBig=false;
    run.forEach(t=>{
      const kk=kind(t);
      if(kk==='and')return;
      if(kk==='m'){hasBig=true;hasWord=true;total+=(cur||1)*MAG[t];cur=0}
      else if(kk==='half'){cur+=.5;hasWord=true}
      else{if(kk!=='d')hasWord=true;if(kk==='h')hasBig=true;cur+=val(t)}
    });
    total+=cur;
    if(hasWord&&(hasBig||total>=20))out.push(String(Math.round(total*1e4)/1e4));
    else out.push(run.join(' '));
    i=j;
  }
  return out.join(' ');
}

  const el=document.getElementById(VOICE.id);if(!el){voiceStop(true);return}  /* با شناسه پیدا می‌کنیم؛ «ثبت سریع» ممکن است فرم را دوباره بسازد */
  const t=final?faNumWords(text):text;
  el.value=(VOICE.base?VOICE.base+' ':'')+t;
  el.dispatchEvent(new Event('input',{bubbles:true}));
}
async function voiceStart(btn){
  const el=document.getElementById(btn.dataset.for);if(!el)return;
  if(!SR){voiceStatus('این مرورگر از ورودی صوتی پشتیبانی نمی‌کند. Chrome، Edge یا Safari جدید را امتحان کنید؛ در Firefox وجود ندارد.',true);return}
  if(!window.isSecureContext){voiceStatus('ورودی صوتی فقط روی آدرس امن (https) یا localhost کار می‌کند.',true);return}
  if(VOICE.rec){voiceStop(false);return}
  const rec=new SR();rec.lang='fa-IR';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  /* اگر مدل روی‌دستگاه آماده است، صدا از دستگاه بیرون نمی‌رود */
  let local=false;
  try{if(typeof SR.available==='function'){
    const a=await Promise.race([SR.available({langs:['fa-IR'],processLocally:true}),new Promise(r=>setTimeout(()=>r(null),400))]);
    if(a===true||a==='available'){rec.processLocally=true;local=true}
  }}catch(e){}
  if(!local&&!S.st.voiceOk){
    const yes=await ask('ورودی صوتی','برای تبدیل گفتار به متن، مرورگر شما (در Chrome: سرویس گوگل) صدای شما را پردازش می‌کند و ممکن است آن را به سرور خودش بفرستد. پولینو صدا را ذخیره نمی‌کند. ادامه می‌دهید؟','ادامه');
    if(!yes)return;
    S.st.voiceOk=true;saveSt();
  }
  VOICE.rec=rec;VOICE.id=btn.dataset.for;VOICE.base=el.value.trim();VOICE.got=false;VOICE.err=false;VOICE.local=local;
  rec.onstart=()=>{voiceUi(true);voiceStatus(local?'در حال شنیدن… (پردازش روی دستگاه)':'در حال شنیدن… بگویید: «ناهار دویست و پنجاه هزار تومان»')};
  rec.onresult=ev=>{
    let interim='',fin='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];(r.isFinal?fin+=r[0].transcript:interim+=r[0].transcript)}
    if(fin){VOICE.got=true;voiceWrite(fin.trim(),true)}else if(interim){VOICE.got=true;voiceWrite(interim.trim(),false)}
  };
  rec.onerror=ev=>{
    if(ev.error==='aborted')return;
    VOICE.err=true;voiceStatus(VOICE_ERR[ev.error]||'خطا در ورودی صوتی ('+(ev.error||'نامشخص')+').',true);
  };
  rec.onend=()=>{
    clearTimeout(VOICE.timer);voiceUi(false);
    if(!VOICE.err){
      if(VOICE.got){const e=document.getElementById(VOICE.id);if(e)voiceWrite(e.value.slice(VOICE.base?VOICE.base.length+1:0).trim(),true);voiceStatus('')}
      else voiceStatus('متنی تشخیص داده نشد. دوباره تلاش کنید.',true);
    }
    VOICE.rec=null;VOICE.id=null;
  };
  try{rec.start();VOICE.timer=setTimeout(()=>voiceStop(false),20000)}
  catch(e){VOICE.rec=null;voiceStatus('شروع ورودی صوتی ممکن نشد. چند لحظه بعد دوباره امتحان کنید.',true)}
}

async function goalAutoAlloc(txs){
  const res=[],touched=new Set();
  for(const tx of txs||[]){
    if(!tx||tx.type!=='income'||tx.noGoal)continue;
    for(const a of E.allocateIncome(activeGoals(),tx.amount,today())){
      const g=goalById(a.goalId);if(!g)continue;
      g.contribs=(g.contribs||[]).concat({id:uid(),date:tx.date,amount:a.amount,kind:'auto',txId:tx.id});
      touched.add(g);res.push({name:g.name,amount:a.amount});
    }
  }
  if(touched.size)await DB.putMany('goals',[...touched]);
  return res;
}

/* ================= لایسنس و فعال‌سازی (Worker مشترک AIhub، توکن امضاشده ECDSA P-256) =================
   - فعال‌سازی: یک‌بار آنلاین (activate)؛ بعد از آن توکن امضاشده روی دستگاه ذخیره می‌شود و آفلاین کار می‌کند.
   - اعتبارسنجی آنلاین هر ۷ روز (در صورت اتصال)؛ قطعی اینترنت هرگز برنامه را قفل نمی‌کند.
   - داده‌ی کاربر هرگز پاک یا گروگان نمی‌شود: در حالت منقضی/باطل، دانلود Backup همیشه آزاد است. */
const LIC_API='https://aihub-license.get-aihubtools.workers.dev',LIC_PRODUCT='polino',LIC_PUBLIC_JWK={"kty": "EC", "crv": "P-256", "x": "oaMsNWVXFBV3s7IW55TXXWc8b2fUkG6x-CQOunje2fM", "y": "CpMhKno5HTtkUg7r9kykintWA_g-9E8xavFNyGJycDg"},LIC_ENFORCE=true;
const LIC_KEY='license',LIC_REVAL_DAYS=7,LIC_SUPPORT='\u2066@aihub_tools\u2069';
const LIC={row:null,blocked:false,state:'off',msg:'',busy:false};
const LIC_ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const licKeyMissing=()=>/PASTE_/.test(String(LIC_PUBLIC_JWK.x||'')+String(LIC_PUBLIC_JWK.y||''));
function licNewDevice(){const r=new Uint8Array(12);crypto.getRandomValues(r);let s='';for(let i=0;i<12;i++){s+=LIC_ALPHA[r[i]%32];if(i%4===3&&i<11)s+='-'}return s}
function licB64(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function licSave(){
  try{await DB.put('settings',{key:LIC_KEY,value:LIC.row})}catch(e){}
  try{localStorage.setItem('polino.lic',JSON.stringify(LIC.row))}catch(e){}
}
async function licLoad(){
  let row=null;
  try{const all=await DB.getAll('settings'),x=all.find(r=>r.key===LIC_KEY);row=x&&x.value}catch(e){}
  if(!row){try{row=JSON.parse(localStorage.getItem('polino.lic')||'null')}catch(e){}}
  if(!row||!row.dev)row=Object.assign({},row||{},{dev:licNewDevice()});
  LIC.row=row;await licSave();
}
/* بررسی امضا با کلید عمومی؛ payload یا null */
async function licVerify(token){
  try{
    const parts=String(token||'').trim().split('.');if(parts.length!==2||!parts[0]||!parts[1])return null;
    const jwk={kty:'EC',crv:'P-256',x:LIC_PUBLIC_JWK.x,y:LIC_PUBLIC_JWK.y};
    const key=await crypto.subtle.importKey('jwk',jwk,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,licB64(parts[1]),new TextEncoder().encode(parts[0]));
    if(!ok)return null;
    return JSON.parse(new TextDecoder().decode(licB64(parts[0])));
  }catch(e){return null}
}
/* زمان امن: اگر ساعت دستگاه عقب برده شود، آخرین زمان دیده‌شده ملاک است */
const licNow=()=>Math.max(Date.now(),(LIC.row&&LIC.row.lastSeen)||0);
async function licCheck(token){
  const p=await licVerify(token);
  if(!p)return{ok:false,reason:'sig'};
  if(p.p!==LIC_PRODUCT)return{ok:false,reason:'product'};
  if(p.d!==LIC.row.dev)return{ok:false,reason:'device'};
  if(licNow()>p.exp)return{ok:false,reason:'expired',payload:p};
  return{ok:true,payload:p};
}
const LIC_MSG={
  notfound:'این کد معتبر نیست. نوشتار آن را دوباره بررسی کنید.',
  revoked:'این لایسنس غیرفعال شده است. با پشتیبانی تماس بگیرید ('+LIC_SUPPORT+').',
  expired:'اشتراک این لایسنس تمام شده است. برای تمدید با پشتیبانی تماس بگیرید ('+LIC_SUPPORT+'). بعد از تمدید، دکمه‌ی «فعال‌سازی» را دوباره بزنید.',
  devices:'ظرفیت ۳ دستگاه این لایسنس پر شده است. از پشتیبانی ('+LIC_SUPPORT+') بخواهید یک دستگاه را آزاد کند.',
  product:'این کد برای پولینو نیست.',
  device:'این دستگاه برای این لایسنس فعال نیست؛ دوباره فعال‌سازی کنید.',
  sig:'کد فعال‌سازی معتبر نیست یا برای این دستگاه صادر نشده است.',
  net:'اتصال به سرور برقرار نشد. VPN را روشن کنید و دوباره تلاش کنید، یا از «فعال‌سازی دستی» پایین صفحه استفاده کنید.',
  nokey:'کلید عمومی لایسنس در این نسخه تنظیم نشده است (مخصوص سازنده برنامه).'
};
async function licCall(action,extra){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),15000);
  try{
    const r=await fetch(LIC_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action},extra)),signal:ctl.signal});
    const j=await r.json();return r.status>=500?{net:true}:j;
  }catch(e){return{net:true}}finally{clearTimeout(t)}
}
async function licInit(){
  await licLoad();
  if(!LIC_ENFORCE){LIC.state='off';return}
  if(licKeyMissing()){LIC.blocked=true;LIC.state='nokey';LIC.msg=LIC_MSG.nokey;return}
  if(!LIC.row.token){LIC.blocked=true;LIC.state='none';return}
  const c=await licCheck(LIC.row.token);
  if(c.ok){
    LIC.state='active';
    if(licNow()-(LIC.row.lastSeen||0)>36e5){LIC.row.lastSeen=licNow();await licSave()}
    setTimeout(()=>licBackground(false),2500);return;
  }
  if(c.reason==='expired'&&Date.now()>(LIC.row.lastSeen||0)){LIC.row.lastSeen=Date.now();await licSave()} /* انقضا با ساعت درست دیده شد؛ عقب‌بردن ساعت دیگر کمکی نمی‌کند */
  LIC.blocked=true;LIC.state=c.reason==='expired'?'expired':'none';LIC.msg=c.reason==='expired'?LIC_MSG.expired:'';
}
/* تأیید دوره‌ای آنلاین؛ خطای شبکه هیچ‌وقت چیزی را قفل نمی‌کند */
async function licBackground(force){
  const r0=LIC.row;if(!LIC_ENFORCE||!r0||!r0.token||!r0.license)return 'skip';
  if(!force&&Date.now()-(r0.checkedAt||0)<LIC_REVAL_DAYS*864e5)return 'fresh';
  const r=await licCall('validate',{license:r0.license,device:r0.dev,product:LIC_PRODUCT});
  if(r.net)return 'offline';
  if(r.valid){
    const c=await licVerify(r.token);
    if(c&&c.d===r0.dev&&c.p===LIC_PRODUCT){r0.token=r.token;r0.exp=r.exp;r0.checkedAt=Date.now();r0.lastSeen=Math.max(r0.lastSeen||0,Date.now());await licSave();return 'ok'}
    return 'sig';
  }
  const reason=r.reason||'notfound';
  if(reason!=='expired'){r0.token=null;r0.exp=null}
  await licSave();
  LIC.blocked=true;LIC.state=reason;LIC.msg=LIC_MSG[reason]||LIC_MSG.notfound;render();
  return reason;
}
async function licStore(license,token,payload){
  Object.assign(LIC.row,{license,token,exp:payload.exp,checkedAt:Date.now(),lastSeen:Math.max(LIC.row.lastSeen||0,Date.now())});
  await licSave();LIC.blocked=false;LIC.state='active';LIC.msg='';
}

function licBusy(on){LIC.busy=on;document.querySelectorAll('#lock [data-act=licActivate],#lock [data-act=licManual]').forEach(b=>{b.disabled=on})}
async function licActivate(){
  if(LIC.busy)return;
  const code=(($('#licKey')||{}).value||'').trim().toUpperCase().replace(/\s+/g,'');
  if(!/^[A-Z0-9-]{8,40}$/.test(code)){licSetMsg('کد لایسنس را وارد کنید (مثلاً POLINO-XXXX-XXXX-XXXX).');return}
  licBusy(true);licSetMsg('در حال اتصال به سرور…','ok');
  const r=await licCall('activate',{license:code,device:LIC.row.dev,product:LIC_PRODUCT});
  licBusy(false);
  if(r.net){licSetMsg(LIC_MSG.net);return}
  if(r.valid){
    const c=await licVerify(r.token);
    if(!c||c.d!==LIC.row.dev||c.p!==LIC_PRODUCT){licSetMsg(LIC_MSG.sig);return}
    await licStore(code,r.token,c);await licAfter();return;
  }
  licSetMsg(LIC_MSG[r.reason]||r.message||LIC_MSG.notfound);
}

function dpSet(iso){
  const el=DP.el;if(!el)return;
  el.value=E.fmtJ(iso);dpClose();
  el.dispatchEvent(new Event('input',{bubbles:true}));
  el.dispatchEvent(new Event('change',{bubbles:true}));
  el.dispatchEvent(new CustomEvent('dp:pick',{bubbles:true}));
}
function dpAct(b){
  const a=b.dataset.dp;
  if(a==='close'){dpClose();return}
  if(a==='pick'){dpSet(b.dataset.iso);return}
  if(a==='today'){dpSet(today());return}
  if(a==='clear'){const el=DP.el;el.value='';dpClose();el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));el.dispatchEvent(new CustomEvent('dp:pick',{bubbles:true}));return}
  if(a==='title'){DP.view=DP.view==='days'?'months':'years';if(DP.view==='years')DP.ys=DP.y-5;dpDraw();return}
  if(a==='month'){DP.m=+b.dataset.v;DP.view='days';DP.focus=E.jToIso(DP.y,DP.m,1);dpDraw();return}
  if(a==='year'){DP.y=+b.dataset.v;DP.view='months';dpDraw();return}
  if(a==='prev'||a==='next'){
    const s=a==='next'?1:-1;
    if(DP.view==='days'){const x=E.addMonths(DP.y,DP.m,s);DP.y=x.jy;DP.m=x.jm;DP.focus=E.jToIso(DP.y,DP.m,1)}
    else if(DP.view==='months')DP.y+=s;else DP.ys+=12*s;
    dpDraw();
  }
}
function dpKey(e){
  if(!dpOpened())return false;
  if(e.key==='Escape'){e.stopPropagation();e.preventDefault();dpClose();return true}
  if(DP.view!=='days')return false;
  const mv={ArrowRight:-1,ArrowLeft:1,ArrowUp:-7,ArrowDown:7}[e.key];
  if(mv!==undefined&&e.target.closest&&e.target.closest('.dp-grid')){
    e.preventDefault();e.stopPropagation();
    const ni=E.addDays(DP.focus,mv),j=E.isoToJ(ni);DP.focus=ni;DP.y=j.jy;DP.m=j.jm;dpDraw();
    const t=document.querySelector('#dp .dp-d[data-iso="'+ni+'"]');if(t){t.tabIndex=0;t.focus({preventScroll:true})}
    return true;
  }
  if(e.key==='PageDown'||e.key==='PageUp'){
    e.preventDefault();e.stopPropagation();
    const x=E.addMonths(DP.y,DP.m,e.key==='PageDown'?1:-1);DP.y=x.jy;DP.m=x.jm;DP.focus=E.jToIso(DP.y,DP.m,1);dpDraw(true);return true;
  }
  return false;
}

const DD={sel:null,items:[],title:''};
function ddItems(sel){
  const out=[];
  for(const c of sel.children){
    if(c.tagName==='OPTGROUP'){out.push({g:true,label:c.label});for(const o of c.children)out.push({v:o.value,label:o.textContent,dis:o.disabled,on:o.value===sel.value&&o.selected})}
    else if(c.tagName==='OPTION')out.push({v:c.value,label:c.textContent,dis:c.disabled,on:c.value===sel.value&&c.selected});
  }
  return out;
}
function ddListHtml(q){
  const nq=q?E.cmpText(q):'';let h='',pendG=null,any=false;
  for(const it of DD.items){
    if(it.g){pendG=it;continue}
    if(nq&&E.cmpText(it.label).indexOf(nq)<0)continue;
    if(pendG){h+='<div class="dd-g">'+esc(pendG.label)+'</div>';pendG=null}
    any=true;
    h+='<button type="button" class="dd-i'+(it.on?' on':'')+'" role="option" aria-selected="'+(it.on?'true':'false')+'" data-dd="pick" data-v="'+esc(it.v)+'"'+(it.dis?' disabled':'')+'><span>'+esc(it.label)+'</span>'+(it.on?ic('check',18):'')+'</button>';
  }
  return any?h:'<div class="dd-empty">موردی پیدا نشد</div>';
}
function ddOpen(sel,wrap){
  DD.sel=sel;DD.items=ddItems(sel);
  const lbl=(sel.id&&document.querySelector('label[for="'+sel.id+'"]'))||null;
  DD.title=(lbl?lbl.textContent:sel.getAttribute('aria-label'))||'';
  const cnt=DD.items.filter(i=>!i.g).length,wide=window.innerWidth>=700;
  let st='';
  if(wide){
    const r=(wrap||sel).getBoundingClientRect(),below=window.innerHeight-r.bottom-14,above=r.top-14,up=below<240&&above>below,mh=Math.max(180,Math.min(360,up?above:below));
    st='left:'+Math.max(8,Math.min(r.left,window.innerWidth-Math.max(r.width,230)-8))+'px;width:'+Math.max(r.width,230)+'px;max-height:'+mh+'px;'+(up?'bottom:'+(window.innerHeight-r.top+6)+'px':'top:'+(r.bottom+6)+'px');
  }
  const host=document.getElementById('dd')||(()=>{const d=document.createElement('div');d.id='dd';document.body.appendChild(d);return d})();
  host.innerHTML='<div class="dd-scrim" data-dd="close"></div><div class="dd'+(wide?'':' sheet-m')+'" role="listbox" aria-label="'+esc(DD.title)+'"'+(st?' style="'+st+'"':'')+'>'
    +(!wide&&DD.title?'<div class="dd-t">'+esc(DD.title)+'</div>':'')
    +(cnt>12?'<div class="dd-s"><input class="inp" id="dd-q" placeholder="جست‌وجو…" autocomplete="off"></div>':'')
    +'<div class="dd-list" id="dd-list">'+ddListHtml('')+'</div></div>';
  const on=host.querySelector('.dd-i.on');
  if(on){try{on.scrollIntoView({block:'center'})}catch(e){}if(wide||cnt<=12)try{on.focus({preventScroll:true})}catch(e){}}
  else if(wide){const q=host.querySelector('#dd-q');if(q)q.focus()}
}
function ddClose(refocus){const h=document.getElementById('dd');if(h)h.innerHTML='';if(refocus&&DD.sel)try{DD.sel.focus({preventScroll:true})}catch(e){}DD.sel=null}
const ddOpened=()=>!!(DD.sel&&document.getElementById('dd')&&document.getElementById('dd').innerHTML);
function ddPick(v){
  const s=DD.sel;if(!s)return;
  const changed=s.value!==v;s.value=v;ddClose(true);
  if(changed){s.dispatchEvent(new Event('input',{bubbles:true}));s.dispatchEvent(new Event('change',{bubbles:true}))}
}
function ddKey(e){
  if(!ddOpened())return false;
  if(e.key==='Escape'){e.stopPropagation();e.preventDefault();ddClose(true);return true}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    const L=[...document.querySelectorAll('#dd .dd-i:not([disabled])')];if(!L.length)return true;
    e.preventDefault();e.stopPropagation();
    const i=L.indexOf(document.activeElement),n=e.key==='ArrowDown'?(i<0?0:Math.min(L.length-1,i+1)):(i<=0?0:i-1);
    L[n].focus();return true;
  }
  return false;
}

document.addEventListener('keydown',e=>{
  if(dpKey(e))return;if(ddKey(e))return;

  if(t&&t.tagName==='SELECT'&&t.closest&&t.closest('.sel')&&!t.disabled&&(e.key==='Enter'||e.key===' '||e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();ddOpen(t,t.closest('.sel'))}
},true);
document.addEventListener('click',e=>{
  const t=e.target;if(!t||!t.closest)return;
  const dpb=t.closest('[data-dp]');if(dpb&&dpb.closest('#dp')){e.preventDefault();dpAct(dpb);return}
  const ddb=t.closest('[data-dd]');if(ddb&&ddb.closest('#dd')){e.preventDefault();if(ddb.dataset.dd==='close')ddClose(true);else if(!ddb.disabled)ddPick(ddb.dataset.v);return}
  const inp=t.closest(DP_SEL);if(inp&&inp.tagName==='INPUT'&&!inp.disabled&&!inp.readOnly){e.preventDefault();dpOpen(inp);return}

const RPS={kind:'month',jy:0,jm:0,js:0,from:'',to:'',allExp:false,ready:false};
function rpInit(){
  if(RPS.ready)return;
  const j=E.isoToJ(today());
  RPS.jy=V&&V.jy?V.jy:j.jy;RPS.jm=V&&V.jm?V.jm:j.jm;RPS.js=E.seasonOf(RPS.jm);
  RPS.from=E.jToIso(j.jy,j.jm,1);RPS.to=today();RPS.ready=true;

const rpPeriod=()=>E.reportPeriod({kind:RPS.kind,jy:RPS.jy,jm:RPS.jm,js:RPS.js,from:RPS.from,to:RPS.to,txs:S.txs,today:today()});
const RP_PREV={month:'ماه قبل',season:'فصل قبل',year:'سال قبل',custom:'بازه‌ی قبل'};
function rpYears(){
  const cy=E.isoToJ(today()).jy;let mn=cy-1;
  for(const t of S.txs){const y=E.isoToJ(t.date).jy;if(y<mn)mn=y}
  const out=[];for(let y=cy+1;y>=Math.max(mn,cy-15);y--)out.push(y);
  if(!out.includes(RPS.jy))out.push(RPS.jy);
  return out.sort((a,b)=>b-a);
}
function rpDelta(d,goodUp,label){
  if(d==null)return '';
  if(Math.abs(d)<0.005)return '<div class="rp-d">بدون تغییر نسبت به '+esc(label)+'</div>';
  const up=d>0,good=goodUp?up:!up;
  return '<div class="rp-d '+(good?'inc':'exp')+'">'+(up?'▲':'▼')+' '+E.toFa(Math.round(Math.abs(d)*100))+'٪ <span class="muted">نسبت به '+esc(label)+'</span></div>';
}
function rpChart(R){
  const b=R.buckets,n=b.length;if(!n)return '';
  const W=Math.max(300,n*(n>24?15:n>12?24:36)),H=176,pT=8,pB=24,ch=H-pT-pB;
  const mx=Math.max(1,...b.map(x=>Math.max(x.income,x.expense))),step=W/n,bw=Math.max(3,Math.min(step*.34,16));
  const every=Math.max(1,Math.ceil(n/Math.floor(W/34)));
  let g='';
  for(let k=0;k<=3;k++){const y=pT+ch*k/3;g+='<line x1="0" x2="'+W+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" class="rp-grid"/>'}
  b.forEach((x,i)=>{
    const cx=W-(i+.5)*step,hi=x.income/mx*ch,he=x.expense/mx*ch;
    g+='<g><title>'+esc(x.title)+'\nدرآمد: '+E.fmtNum(x.income)+'\nهزینه: '+E.fmtNum(x.expense)+'</title>'
      +'<rect x="'+(cx+1).toFixed(1)+'" y="'+(pT+ch-hi).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(x.income>0?2:0,hi).toFixed(1)+'" rx="2.5" fill="var(--income)"/>'
      +'<rect x="'+(cx-bw-1).toFixed(1)+'" y="'+(pT+ch-he).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(x.expense>0?2:0,he).toFixed(1)+'" rx="2.5" fill="var(--expense)"/>'
      +(i%every===0?'<text x="'+cx.toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+esc(x.label)+'</text>':'')+'</g>';
  });
  return '<div class="rp-chart"><svg viewBox="0 0 '+W+' '+H+'" style="min-width:'+Math.min(W,2000)+'px;width:100%;height:auto" role="img" aria-label="نمودار درآمد و هزینه">'+g+'</svg></div><div class="row" style="gap:14px;margin-top:6px"><span class="xs muted"><i class="dot" style="background:var(--income)"></i> درآمد</span><span class="xs muted"><i class="dot" style="background:var(--expense)"></i> هزینه</span><span class="xs faint">'+(R.gran==='day'?'روزانه':R.gran==='month'?'ماهانه':'سالانه')+'</span></div>';
}

function rpStep(s){

  else RPS.jy+=s;
  render();
}

async function deleteAcc(id){

async function saveLoan(id){
  const name=$('#ln').value.trim(),pr=$('#lp').value.trim()===''?0:readAmt('lp'),e=[];
  if(!name)e.push('عنوان را وارد کنید.');
  if(isNaN(pr)||pr<0)e.push('مبلغ دریافتی معتبر نیست.');
  if(id){
    if(e.length){showErr(e);return}
    const l=S.loans.find(x=>x.id===id);
    Object.assign(l,{name,type:$('#lt').value,lender:readBank('lbank'),principal:pr,accountId:$('#lx').value||null,note:$('#lnote').value.trim(),active:$('#lact').checked});
    await DB.put('loans',l);toast('تغییرات ذخیره شد');openLoan(id);render();return;
  }
  const cnt=parseInt(E.toEn($('#lc').value),10),am=readAmt('la'),first=readDate('lf'),paid=parseInt(E.toEn($('#lk').value||'0'),10),iv=+$('#li').value;
  if(!(cnt>=1&&cnt<=600))e.push('تعداد اقساط باید بین ۱ تا ۶۰۰ باشد.');
  if(!(am>0))e.push('مبلغ هر قسط باید بیشتر از صفر باشد.');
  if(!first)e.push('تاریخ اولین قسط معتبر نیست.');
  if(!(paid>=0&&paid<=cnt))e.push('تعداد اقساط پرداخت‌شده نباید از کل اقساط بیشتر باشد.');
  if(e.length){showErr(e);return}
  const rate=$('#lr').value.trim()===''?null:E.parseAmount($('#lr').value);
  const loan={id:uid(),name,type:$('#lt').value,lender:readBank('lbank'),principal:pr,rate:isNaN(rate)?null:rate,intervalMonths:iv,accountId:$('#lx').value||null,note:$('#lnote').value.trim(),active:true,createdAt:Date.now(),installments:E.buildSchedule({firstDue:first,count:cnt,amount:am,intervalMonths:iv,paidCount:paid})};
  const ve=E.validateLoan(loan);if(ve.length){showErr(ve);return}
  try{await DB.put('loans',loan)}catch(x){showErr(['ذخیره انجام نشد.']);return}
  S.loans.push(loan);R.route='oblig';R.ob='loans';closeSheet();toast('وام ثبت شد و جدول اقساط ساخته شد');render();
}

function openPay(id,no,back){

  openSettle({kind:'installment',loanId:id,no,back,catType:'expense',amount:i.amount,accountId:l.accountId,title:'پرداخت قسط '+E.toFa(no)+' از '+E.toFa(l.installments.length),sub:l.name+(l.lender?' | '+l.lender:'')+' | سررسید '+E.fmtJ(i.dueDate),cta:'ثبت پرداخت'});
}

  const c=S.cheques.find(x=>x.id===id),isI=c.direction==='issued';
  openSettle({kind:'cheque',chequeId:id,catType:isI?'expense':'income',amount:c.amount,accountId:c.accountId,title:isI?'پاس‌شدن چک پرداختی':'وصول چک دریافتی',sub:(c.counterparty||'')+(c.number?' | شماره '+c.number:'')+' | سررسید '+E.fmtJ(c.dueDate),cta:isI?'ثبت پرداخت چک':'ثبت وصول چک'});
}
async function saveSettle(){
  const cfg=D.settle,amount=readAmt('sa'),date=readDate('sdate'),mark=$('#smark').checked,e=[];
  if(!(amount>0))e.push('مبلغ باید بیشتر از صفر باشد.');if(!date)e.push('تاریخ معتبر نیست.');
  const accountId=$('#sacc').value,categoryId=$('#scat').value;
  if(e.length){showErr(e);return}
  const isInst=cfg.kind==='installment';
  const loan=isInst?S.loans.find(x=>x.id===cfg.loanId):null,chq=isInst?null:S.cheques.find(x=>x.id===cfg.chequeId);
  let tx=null;
  if(!mark){
    tx={id:uid(),type:isInst?'expense':(chq.direction==='issued'?'expense':'income'),amount,date,accountId,categoryId,description:isInst?'قسط '+loan.name+' ('+cfg.no+' از '+loan.installments.length+')':'چک '+(chq.counterparty||''),note:'',createdAt:Date.now(),updatedAt:Date.now()};
    if(isInst){tx.loanId=loan.id;tx.installmentNo=cfg.no;if(loan.demo)tx.demo=true}else{tx.chequeId=chq.id;if(chq.demo)tx.demo=true}
    const ve=E.validateTx(tx,{accounts:S.accounts,categories:S.categories});if(ve.length){showErr(ve);return}
    try{await DB.put('transactions',tx)}catch(x){showErr(['ذخیره انجام نشد.']);return}
    S.txs.push(tx);S.st.lastAccountId=accountId;saveSt();
  }
  if(isInst){const i=loan.installments.find(x=>x.no===cfg.no);Object.assign(i,{paid:true,paidDate:date,paidAmount:amount,txId:tx?tx.id:null,external:mark});await DB.put('loans',loan)}
  else{Object.assign(chq,{status:'cleared',clearedDate:date,txId:tx?tx.id:null,accountId:accountId||chq.accountId});await DB.put('cheques',chq)}
  toast(isInst?'پرداخت قسط ثبت شد':'وضعیت چک به «پاس‌شده» تغییر کرد');
  if(cfg.back==='loan')openLoan(loan.id);else closeSheet();
  render();
}
async function unpayIns(id,no){
  const l=S.loans.find(x=>x.id===id),i=l.installments.find(x=>x.no===no);
  if(!await ask('لغو پرداخت قسط '+E.toFa(no),i.txId?'قسط دوباره «پرداخت‌نشده» می‌شود و تراکنش ثبت‌شده‌ی آن حذف می‌شود.':'قسط دوباره «پرداخت‌نشده» می‌شود.','لغو پرداخت',true))return;
  if(i.txId){await DB.del('transactions',i.txId);S.txs=S.txs.filter(t=>t.id!==i.txId)}
  Object.assign(i,{paid:false,paidDate:null,paidAmount:null,txId:null,external:false});await DB.put('loans',l);openLoan(id);render();
}

  const items=E.upcomingAll(S.loans,S.cheques,S.recurring,today(),400,lead(),S.debts).filter(i=>i.days>=0);

  const d=new Date(),z=n=>(n<10?'0':'')+n,now=d.getUTCFullYear()+z(d.getUTCMonth()+1)+z(d.getUTCDate())+'T'+z(d.getUTCHours())+z(d.getUTCMinutes())+z(d.getUTCSeconds())+'Z';
  download('reminders-'+stamp()+'.ics',E.buildICS(items,{lead:lead(),unit:unit(),now}),'text/calendar');
  toast(E.toFa(items.length)+' سررسید در فایل تقویم ذخیره شد');
}

  exportICS,toggleNotify,backup:doBackup,
  theme:async t=>{S.st.theme=t.dataset.v;applyTheme();await saveSt();render()},
  setCur:async()=>{const v=$('#curSel').value;if(v===S.st.currency)return;if(!await ask('تغییر برچسب واحد','فقط نام واحد عوض می‌شود و مبلغ‌ها تغییر نمی‌کنند. برای تبدیل مبلغ‌ها از دکمه‌های «تبدیل مبلغ‌ها» استفاده کنید.','تغییر برچسب'))return;S.st.currency=v;await saveSt();render()},
  convert:t=>openConvert(t.dataset.v),loadDemo,rmDemo,wipe
};
Object.assign(ACT,ACT3,ACT4,ACT5,ACT6,ACT7,ACT8,ACT9);
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.closest('button')&&t.closest('button')!==t&&t.tagName!=='BUTTON'){/* دکمه‌ی داخلی ردیف خودش مدیریت می‌شود */}
  const f=ACT[t.dataset.act];if(!f)return;
  e.preventDefault();
  if(t.classList.contains('rw')||t.classList.contains('card'))if(e.target.closest('button[data-act]')&&e.target.closest('button[data-act]')!==t)return;
  Promise.resolve(f(t,e)).catch(err=>{console.error('خطا');toast('خطایی رخ داد. دوباره تلاش کنید.')});
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#dlg').innerHTML)$('#dlg').innerHTML='';else closeSheet();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.act){e.preventDefault();e.target.click()}
});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='fquick')onQuick();
  else if(id==='famount'||id==='fdate')updHints();
  else if(id==='fq'){F.q=t.value;F.limit=80;$('#txlist').innerHTML=txListHtml()}
  else if(id==='an')D.nameTouched=true;
  else if(t.dataset&&t.dataset.date!==undefined)hintDate(t);
  else if(t.dataset&&t.dataset.amt!==undefined){hintAmt(t);if(id==='lp'||id==='la')updLoanSum()}
  if(id==='lc')updLoanSum();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.bind){F[t.dataset.bind]=t.value;F.limit=80;$('#txlist').innerHTML=txListHtml()}
  else if(t.dataset&&t.dataset.set){S.st[t.dataset.set]=+t.value;saveSt().then(()=>{toast('ذخیره شد');render()})}
  else if(t.id==='restoreFile'&&t.files[0]){restoreFromFile(t.files[0]);t.value=''}
  else if(t.id==='fcat'&&t.value==='__new__')quickNewCat();
  else if(t.tagName==='SELECT'&&document.getElementById(t.id+'-o')){const o=document.getElementById(t.id+'-o');o.style.display=t.value==='__o__'?'':'none';if(t.value==='__o__')o.focus();if(t.id==='abank'&&D&&D.type!==undefined)syncAccForm()}
});
async function startApp(){S.locked=!!S.st.pinHash;await initFs();render();if(!S.locked&&!LIC.blocked){maybeNotify();autoPostRecurring()}}
load().then(async()=>{await licInit();await startApp()}).catch(e=>{console.error('init');document.getElementById('main').innerHTML='<div class="card err">راه‌اندازی برنامه ناموفق بود. صفحه را دوباره باز کنید یا مرورگر دیگری امتحان کنید.</div>'});
window.__malyar={S,F,V,R,ACT,render,go,openTx,newDraft,D:()=>D,E,smsRun,smsSaveAll,buildReport,openRecPost,autoPostRecurring,pinHash,lockNow,unlock:tryUnlock,DB,buildQueue,syncQueue,toggleNotify,faNumWords,voice:VOICE,goalAutoAlloc,insightList,RPS,rpReport,dpOpen,ddOpen,LIC,licBackground,licActivate,licVerify,licInit};
})();

</script>
